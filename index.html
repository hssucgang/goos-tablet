<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>GOOS Production</title><!-- GOOS-RUNNER-APP -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F2A4A">
<style>
:root{--cream:#FAF5EA;--navy:#1F2A4A;--peri:#8C9BE0;--wheat:#E0B54A;--ok:#256B45;--warn:#8F6111;--fail:#9E2E2E;--line:#D8CFBB}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:18px/1.5 system-ui,sans-serif;background:var(--cream);color:var(--navy)}
header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header b{font-size:20px}header small{opacity:.85;margin-left:auto;text-align:right;line-height:1.25;font-size:14px}
main{padding:16px;max-width:900px;margin:0 auto;padding-bottom:130px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;border-top:4px solid var(--peri)}
h2{margin:0 0 6px;font-size:24px}h3{margin:18px 0 8px;font-size:17px;text-transform:uppercase;letter-spacing:.06em;color:#55607A}
label{display:block;font-size:16px;font-weight:600;color:#55607A;margin:12px 0 5px}
input,select,textarea{width:100%;padding:16px;font-size:22px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--navy)}
input:focus,textarea:focus{outline:4px solid var(--peri);outline-offset:1px}
.ovopt{display:block;border:2px solid var(--line);border-radius:12px;padding:14px;
 margin-top:10px;font-size:19px;background:#fff}
.ovopt input{width:auto;margin-right:8px;transform:scale(1.4)}
.ovopt .req{font-size:16px;margin:4px 0 0}
input:disabled{background:#E5E0D6;color:#6E6A5E;border-color:#CCC4B2}
button{font:700 19px system-ui;padding:17px 18px;border:0;border-radius:12px;background:var(--navy);color:#fff;width:100%;margin-top:12px}
button.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
button.gold{background:var(--wheat);color:#2A2003}
button:disabled{opacity:.45}
.row{display:flex;gap:10px}.row>*{flex:1}
.item{border:2px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;background:#fff}
.item.done{border-color:var(--ok);background:#F1FAF4}
.item.lock{background:#EFEDE6;border-color:#CCC4B2}
.item.lock input{background:#E5E0D6;color:#6E6A5E;border-color:#CCC4B2}
.rec{font-size:15px;font-weight:800;color:#55607A;margin-top:8px;letter-spacing:.06em}
.icode{font-weight:800;font-size:24px;line-height:1.25;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.needband{margin:10px 0 12px;background:#FBEFD3;border:2px solid var(--wheat);border-radius:12px;padding:12px 14px}
.needlab{font-size:14px;font-weight:800;letter-spacing:.1em;color:#7A5B12;text-transform:uppercase}
.needval{font:800 40px/1.1 ui-monospace,'DejaVu Sans Mono',monospace;color:#1F2A4A;letter-spacing:1px;margin-top:2px}
.needval .u{font-size:24px;font-weight:700;margin-left:8px;letter-spacing:0}
.item.lock .needband{background:#E9E5DA;border-color:#CCC4B2}
.item.lock .needval{color:#4A4536}
.gotlab{font-size:14px;font-weight:800;letter-spacing:.1em;color:#55607A;text-transform:uppercase;margin-bottom:5px}
.lotbox{border-radius:14px;padding:16px;background:#EFEDE6;border:2px solid #CCC4B2;border-left:12px solid var(--ok);margin-top:12px}
.lotno{font:800 32px/1.2 ui-monospace,monospace;letter-spacing:1px;color:#3E3A2C}
.step{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}
.snum{flex:0 0 34px;height:34px;border-radius:99px;background:var(--navy);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:17px}
.snum.done{background:var(--ok)}
.snum.wait{background:#B8B1A0}
.stitle{font-weight:800;font-size:19px}
.grp{border-radius:14px;padding:2px 12px 12px;margin:26px 0 22px;border:2px solid var(--line);border-left:14px solid var(--gc)}
.grp:first-of-type{margin-top:10px}
.ghead{display:flex;align-items:center;gap:10px;margin:-2px -12px 14px;padding:14px;border-radius:10px 10px 0 0;background:var(--gc);color:#fff}
.ghead b{font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.ghead span{margin-left:auto;font-size:16px;font-weight:800;background:rgba(255,255,255,.28);padding:5px 12px;border-radius:99px;white-space:nowrap}
.dbtn{flex:0 0 140px;margin:0;font-size:19px}
.name{font-weight:800;font-size:20px}
.req{color:#55607A;font-size:17px}
.tag{display:inline-block;padding:4px 12px;border-radius:99px;font-size:15px;font-weight:800;color:#fff;letter-spacing:.04em}
.PASS{background:var(--ok)}.WATCH{background:var(--warn)}.FAIL{background:var(--fail)}
.timer{font:800 64px/1 ui-monospace,monospace;text-align:center;margin:8px 0 4px;letter-spacing:2px}
.tbox{border-radius:14px;padding:16px;margin:16px 0;background:#F2EEE4;border:2px solid var(--line)}
.tbox.dark{background:#1F2A4A;border-color:#1F2A4A}
.tbox.dark .timer{color:#3B4770}
.tbox.dark .tnote{color:#9DAAE6}
.tnote{text-align:center;font-size:15px;color:#55607A;letter-spacing:.06em;text-transform:uppercase;font-weight:800}
.tstep{border:2px solid var(--line);border-left:14px solid #B8B1A0;border-radius:12px;padding:14px;margin-bottom:14px;background:#fff}
.tstep.open{border-left-color:var(--wheat)}
.tstep.set{border-left-color:var(--ok);background:#F1FAF4}
.tstep.wait{background:#F6F4EE}
.thead{display:flex;align-items:center;gap:12px}
.tn{flex:0 0 40px;height:40px;border-radius:99px;background:#B8B1A0;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:19px}
.tstep.open .tn{background:var(--wheat);color:#2A2003}
.tstep.set .tn{background:var(--ok)}
.ttitle{font-weight:800;font-size:21px;line-height:1.2}
.trule{font-size:16px;font-weight:700;color:#7A5B12;margin-top:2px}
.tstep.set .trule{color:#256B45}
.stamp{font-size:15px;color:var(--ok);font-weight:800;margin-top:8px;letter-spacing:.05em}
.waitmsg{font-size:16px;font-weight:700;color:#7A7568;margin-top:10px}
.dest{font-size:15px;color:#55607A;margin-top:8px;word-break:break-all}
.locked{opacity:.4;pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);padding:12px 16px;display:flex;gap:10px;z-index:6}
.bar>*{flex:1;margin:0}
.err{color:var(--fail);font-size:17px;margin-top:10px;font-weight:700}
li{margin-bottom:10px;font-size:18px}

/* ---- hold-timer alarm ---- */
#alarmwrap{position:fixed;inset:0;z-index:50;display:none;
 background:rgba(31,42,74,.93);align-items:center;justify-content:center;padding:20px}
#alarmwrap.on{display:flex}
#alarmbox{background:var(--cream);border-radius:22px;max-width:520px;width:100%;
 padding:26px 24px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.45)}
#alarmbox .kicker{font-size:15px;font-weight:800;letter-spacing:3px;color:var(--warn)}
#alarmbox.end .kicker{color:var(--fail)}
#alarmbox h2{margin:8px 0 6px;font-size:34px;line-height:1.1;color:var(--navy)}
#alarmbox p{margin:0 0 18px;font-size:19px;color:var(--navy)}
#alarmbox .big{font-size:54px;font-weight:900;letter-spacing:2px;color:var(--navy);
 margin:4px 0 10px}
#alarmstop{width:100%;padding:22px;font-size:24px;font-weight:800;border:none;
 border-radius:16px;background:var(--navy);color:#fff;cursor:pointer}
#alarmbox.end #alarmstop{background:var(--fail)}
#alarmquiet{font-size:14px;color:var(--warn);margin-top:12px;min-height:18px}

/* ---- pre-mix procedure popup ---- */
#procwrap{position:fixed;inset:0;z-index:60;display:none;
 background:rgba(31,42,74,.94);align-items:center;justify-content:center;padding:16px}
#procwrap.on{display:flex}
#procbox{background:var(--cream);border-radius:22px;max-width:660px;width:100%;
 max-height:92vh;overflow:auto;padding:24px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
#procbox .kicker{font-size:15px;font-weight:800;letter-spacing:3px;color:var(--warn)}
#procbox h2{margin:6px 0 4px;font-size:30px;line-height:1.15;color:var(--navy)}
#procbox .sub{font-size:17px;color:var(--navy);margin-bottom:14px}
#procbox ol{margin:0;padding:0;list-style:none;counter-reset:pm}
#procbox li{counter-increment:pm;display:flex;gap:14px;align-items:flex-start;
 background:#fff;border:1px solid var(--line);border-radius:14px;
 padding:16px 16px;margin-bottom:10px}
#procbox li::before{content:counter(pm);flex:0 0 46px;height:46px;border-radius:12px;
 background:var(--navy);color:#fff;font-size:24px;font-weight:800;
 display:flex;align-items:center;justify-content:center}
#procbox li span{font-size:23px;line-height:1.4;color:var(--navy);font-weight:600}
#procdone{width:100%;margin-top:6px;padding:24px;font-size:25px;font-weight:800;
 border:none;border-radius:16px;background:var(--ok);color:#fff;cursor:pointer}
</style></head><body>
<header><b>GOOS &middot; Production</b><small id="hdr"></small></header>
<main id="app"></main>
<div class="bar" id="bar" style="display:none"></div>
<div id="procwrap"><div id="procbox">
 <div class="kicker" id="prockick"></div>
 <h2 id="proctitle"></h2>
 <div class="sub" id="procsub"></div>
 <ol id="proclist"></ol>
 <button id="procdone"></button>
</div></div>
<div id="alarmwrap"><div id="alarmbox">
 <div class="kicker" id="alarmkick"></div>
 <h2 id="alarmtitle"></h2>
 <div class="big" id="alarmbig"></div>
 <p id="alarmmsg"></p>
 <button id="alarmstop">Stop alarm</button>
 <div id="alarmquiet"></div>
</div></div>
<script>
var K='goos_tab_v5';
/* Stamped in when GOOS writes the app, so a tablet can be checked against the
   laptop without guessing which build it is running. */
var APPVER='2.77.0';
var S=JSON.parse(localStorage.getItem(K)||'null')||
  {sched:null,ops:'',done:{},batch:null,pending:[],dest:null};
if(!S.pending)S.pending=[];
if(!S.done)S.done={};
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function $(s){return document.querySelector(s)}
function esc(t){return String(t==null?'':t).replace(/[<>&"]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]})}
function pick(o,keys,d){if(d===undefined)d='';for(var i=0;i<keys.length;i++){var k=keys[i];if(o&&o[k]!=null&&o[k]!=='')return o[k]}return d}
function num(v){var n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?0:n}
function grade(req,act){if(!req)return'PASS';var d=Math.abs(act-req)/req*100;return d<=1?'PASS':d<=2?'WATCH':'FAIL'}
function pad(n){return String(n).length<2?'0'+String(n):String(n)}
/* THE TABLET'S OWN CLOCK, not UTC.
   toISOString() returns UTC, and the report then printed that string as if it
   were the wall clock - so a batch worked at 8:30 in the morning was filed as
   00:30, and an evening batch was filed under the PREVIOUS DAY. Everything is
   now stamped in the tablet's local time with its offset kept on the end, so
   the stamp reads as the clock on the wall and still sorts correctly. */
function nowISO(){
 var d=new Date(),off=-d.getTimezoneOffset(),
     sg=off<0?'-':'+',a=Math.abs(off);
 return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+
  pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+
  sg+pad(Math.floor(a/60))+':'+pad(a%60)}
/* Shown on the setup screen so a tablet whose own clock has drifted is
   visible BEFORE a shift is recorded against the wrong time. */
function clockNow(){var d=new Date();
 var h=d.getHours(),m=pad(d.getMinutes()),ap=h<12?'AM':'PM';
 h=h%12;if(!h)h=12;
 return todayStr()+'  '+h+':'+m+' '+ap}
function todayStr(){var d=new Date();
 return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function clockOf(iso){if(!iso)return'';var d=new Date(iso);
 if(isNaN(d.getTime()))return String(iso);
 return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
function stampOf(iso){if(!iso)return'-';return String(iso).replace('T',' ').slice(0,19)}
function dayOf(iso){return iso?String(iso).slice(0,10):'-'}
/* TWO DECIMALS, everywhere a recipe quantity is shown. Nobody weighs to a
   thousandth of a gram, and a third decimal only makes the number harder to
   read at arm's length on a bench. */
function bigNum(v){var n=Number(v);if(!isFinite(n))return String(v);
 var s=(Math.round(n*100)/100).toString(),p=s.split('.');
 p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return p.join('.')}

/* ---------------- the remembered folder ----------------
   ONE folder does both jobs: GOOS drops today's PROD_TODAY_<date>.json into
   it, and finished reports are written back into it. The handle is kept in
   IndexedDB (localStorage cannot hold one), so after the first setup the app
   opens straight onto today's batches with nothing to pick.               */
var DIR=null;      // schedules come FROM here
var OUT=null;      // finished reports go TO here
function canPickDir(){return typeof window.showDirectoryPicker==='function'}

/* --- tiny IndexedDB wrapper, just for the folder handle --- */
function idb(cb){
 if(!window.indexedDB){cb(null);return}
 var rq;try{rq=indexedDB.open('goos-tablet',1)}catch(e){cb(null);return}
 rq.onupgradeneeded=function(){try{rq.result.createObjectStore('h')}catch(e){}};
 rq.onsuccess=function(){cb(rq.result)};
 rq.onerror=function(){cb(null)}}
function idbPut(key,val,cb){idb(function(db){
 if(!db){if(cb)cb(false);return}
 try{var t=db.transaction('h','readwrite');t.objectStore('h').put(val,key);
  t.oncomplete=function(){if(cb)cb(true)};
  t.onerror=function(){if(cb)cb(false)}}catch(e){if(cb)cb(false)}})}
function idbGet(key,cb){idb(function(db){
 if(!db){cb(null);return}
 try{var r=db.transaction('h','readonly').objectStore('h').get(key);
  r.onsuccess=function(){cb(r.result||null)};
  r.onerror=function(){cb(null)}}catch(e){cb(null)}})}

/* TWO FOLDERS, chosen once and remembered separately:
     IN  - where GOOS drops PROD_TODAY_<date>.json
     OUT - where finished reports are written
   They were one folder before, with reports going into a subfolder it made
   itself. He keeps a dedicated folder for each, so each is picked on its own
   and each is remembered on its own. Choosing only the IN folder still works
   exactly as before - the reports then go to IN/Finished Production - so
   nothing already set up has to be redone. */
function keepDir(h){DIR=h;S.dest=h.name;S.destMode='folder';save();idbPut('dir',h)}
function keepOut(h){OUT=h;S.outName=h.name;S.destMode='folder';save();idbPut('out',h)}
function outName(){return S.outName||(S.dest?(S.dest+' \u203a '+REPORTDIR):'')}

/* Restore without prompting. Calls back with:
   'granted' - ready to use, 'ask' (+handle) - one tap needed because the
   browser only re-grants permission on a user gesture, or 'none'.        */
/* Restore ONE remembered folder without prompting. Calls back with
   'granted', 'ask' (+handle - the browser only re-grants on a tap), or
   'none'. */
function restoreOne(key,cb){
 if(!canPickDir()){cb('none');return}
 idbGet(key,function(h){
  if(!h){cb('none');return}
  if(!h.queryPermission){adopt(key,h);cb('granted');return}
  h.queryPermission({mode:'readwrite'}).then(function(p){
   if(p==='granted'){adopt(key,h);cb('granted')}
   else cb('ask',h)}).catch(function(){cb('ask',h)})})}

function adopt(key,h){
 if(key==='out'){OUT=h;S.outName=h.name}else{DIR=h;S.dest=h.name}
 save()}

/* Both folders at once. `state` is the WORST of the two, because the app can
   only go straight to work when nothing needs a tap. */
function restoreDir(cb){
 restoreOne('dir',function(st1,h1){
  restoreOne('out',function(st2,h2){
   var pend=[];
   if(st1==='ask')pend.push(['dir',h1]);
   if(st2==='ask')pend.push(['out',h2]);
   if(pend.length){cb('ask',pend);return}
   cb(st1==='granted'?'granted':'none')})})}

function grantDir(pending,cb){
 /* pending is [[key,handle],...] - re-granting both on the one tap, so the
    operator is never asked twice in a row. A bare handle is accepted too, so
    an older caller (or a stored state from a previous version) still works. */
 var list=pending&&pending.length?pending:(pending?[['dir',pending]]:[]),
     i=0,anyOK=false;
 function step(){
  if(i>=list.length){cb(anyOK);return}
  var key=list[i][0],h=list[i][1];i++;
  if(!h.requestPermission){key==='out'?keepOut(h):keepDir(h);anyOK=true;step();return}
  h.requestPermission({mode:'readwrite'}).then(function(p){
   if(p==='granted'){key==='out'?keepOut(h):keepDir(h);anyOK=true}
   step()}).catch(step)}
 step()}

/* A separate picker id per role, so the OS reopens each one where it was
   last used rather than sending staff back to the top every time. */
function pickDir(which,cb){
 if(!canPickDir()){cb(false,'not supported');return}
 window.showDirectoryPicker({id:which==='out'?'goos-reports':'goos-schedules',
   mode:'readwrite',startIn:'documents'}).then(function(h){
  var keep=which==='out'?keepOut:keepDir;
  if(!h.requestPermission){keep(h);cb(true,'');return}
  h.requestPermission({mode:'readwrite'}).then(function(p){
   if(p==='granted'){keep(h);cb(true,'')}else cb(false,'permission refused')
  }).catch(function(){cb(false,'permission refused')})
 }).catch(function(){cb(false,'cancelled')})}

/* --- find today's schedule in that folder, newest first ---------------- */
function isSchedName(n){return /^PROD_TODAY_.*\.json$/i.test(n)||
 /^GOOS_PRODUCTION_.*\.json$/i.test(n)}
function schedFiles(cb){
 if(!DIR||!DIR.values){cb([]);return}
 var out=[],it=DIR.values();
 function step(){it.next().then(function(r){
  if(r.done){cb(out);return}
  var e=r.value;
  if(e.kind==='file'&&isSchedName(e.name))out.push(e);
  step()}).catch(function(){cb(out)})}
 step()}
function newestSched(cb){
 schedFiles(function(list){
  if(!list.length){cb(null);return}
  var files=[],i=0;
  function step(){
   if(i>=list.length){
    files.sort(function(a,b){return b.f.lastModified-a.f.lastModified||
      (a.f.name<b.f.name?1:-1)});
    cb(files.length?files[0].f:null);return}
   list[i++].getFile().then(function(f){files.push({f:f});step()})
    .catch(step)}
  step()})}
function loadNewest(cb){
 newestSched(function(f){
  if(!f){cb(null);return}
  var rd=new FileReader();
  rd.onload=function(){try{var j=JSON.parse(rd.result);
   if(!pick(j,['recipes','lines','items'],[]).length)throw 0;cb(j)}catch(x){cb(null)}};
  rd.onerror=function(){cb(null)};
  rd.readAsText(f)})}

/* Adopting a schedule keeps this shift's progress when it is the SAME
   schedule re-read from the folder, and only resets on a genuinely new
   reference - otherwise a reopen mid-shift would wipe finished batches. */
/* A schedule reload must NEVER drop reports that have not been sent. S.done is
   reset for a new reference, but S.pending is the only copy of an unsent
   report and is deliberately left alone. */
function adoptSched(j){
 var oldRef=S.sched?pick(S.sched,['reference','ref'],''):'';
 var newRef=pick(j,['reference','ref'],'');
 if(oldRef&&newRef&&oldRef===newRef){S.sched=j;save();return false}
 S.sched=j;S.ops=pick(j,['operator'],'');S.done={};S.batch=null;save();return true}

/* Reports go into <tablet folder>/Finished Production, so the tablet folder
   itself holds nothing but today's schedule and staff never pick the wrong
   file. If the subfolder cannot be made, write to the folder itself rather
   than lose the report - GOOS looks in both places. */
function reportDir(cb){
 /* A reports folder of its own is used AS IS - it was picked for exactly
    this, so burying the files one level deeper would only hide them. Only
    when reports share the schedule folder is the subfolder made, to keep
    that folder down to the one schedule file. */
 if(OUT){cb(OUT);return}
 if(!DIR){cb(null);return}
 if(!DIR.getDirectoryHandle){cb(DIR);return}
 DIR.getDirectoryHandle(REPORTDIR,{create:true}).then(function(h){cb(h)})
  .catch(function(){cb(DIR)})}

function writeToDir(files,done,fail){
 if(!DIR&&!OUT){fail();return}
 reportDir(function(D){
  if(!D){fail();return}
  var i=0,written=[];
  function next(){
   if(i>=files.length){verifyWritten(D,written,done,fail);return}
   var f=files[i++];
   D.getFileHandle(f.name,{create:true}).then(function(fh){
    return fh.createWritable()}).then(function(w){
    return w.write(f).then(function(){return w.close()})})
    .then(function(){written.push(f);next()}).catch(fail)}
  next()})}

/* READ THE FILES BACK. A write that resolved is not proof the file is there
   with something in it - a full disk, a revoked permission, or OneDrive
   taking the name can all resolve and leave nothing usable. "Sent" has to
   mean sent, or none of this record-keeping is worth anything. */
function verifyWritten(D,files,done,fail){
 var i=0;
 function step(){
  if(i>=files.length){done();return}
  var f=files[i++];
  D.getFileHandle(f.name).then(function(fh){return fh.getFile()})
   .then(function(on){
    if(!on||on.size<=0){fail();return}
    step()})
   .catch(function(){fail()})}
 step()}

/* ---- schedule readers ---- */
function recipes(){return pick(S.sched,['recipes','lines','items'],[])}
function rName(r){return pick(r,['name','recipe','recipe_name','product'],'Recipe')}
function ings(r){return pick(r,['ingredients','components'],[])}
function cookMin(r){return num(pick(r,['cook_minutes','operation_minutes','minutes'],0))||10}
function prod(r,k,alt){var p=r&&r.produce;if(p&&p[k]!=null&&p[k]!=='')return p[k];return pick(r,alt,'')}

 return (p||[]).map(function(x){return typeof x==='string'?x:pick(x,['text','step'],'')})

function wireFileBox(){
 if(!$('#f'))return;
 $('#f').onchange=function(ev){
  var fl=ev.target.files[0];if(!fl)return;var rd=new FileReader();
  rd.onload=function(){try{var j=JSON.parse(rd.result);
   if(!pick(j,['recipes','lines','items'],[]).length)throw 0;
   pendingSched=j;screenLoad();
  }catch(x){alert('That file is not a GOOS production schedule.')}};
  rd.onerror=function(){alert('Could not read that file. Try again.')};
  rd.readAsText(fl)}}

/* ================= SUPERVISOR OVERRIDE =================
   Once a LOT is locked the batch is deliberately one-way: nothing recorded
   against a LOT can be edited, because that is the whole point of a
   traceable batch record. But a schedule sometimes has to CHANGE after work
   has started - a recipe corrected in GOOS, the wrong recipe opened, a LOT
   typed wrong. Without a way out the tablet is stuck until the shift ends.

   So the way out is not an edit. It is a VOID: the batch is abandoned whole,
   under a named person, with a written reason, and the abandoned batch still
   produces a report so the paper trail shows what was weighed and why it was
   stopped. Nothing is quietly rewritten.

   The passcode is checked offline against a PBKDF2 verifier GOOS puts in the
   schedule file - the tablet never holds a passcode, and this works with no
   signal. */
var OV={tries:0,until:0};

/* The key can live on the batch's own schedule OR be recovered from a newer
   schedule file. That matters because of a real chicken-and-egg: a batch
   opened from a pre-2.46 schedule has no key, and loading the new schedule
   that HAS one is itself an override. So the key is fetched separately, the
   open batch is left exactly as it is, and only then can it be voided. */
function ovCfg(){
 var s=S.sched||{};
 return s.override||S.ovkey||null}

function ovTakeKey(j,cb){
 var k=j&&j.override;
 if(!k||!k.hash||!k.salt){cb(false,'That schedule file also has no override '+
  'key. Send it again from GOOS 2.46 or later.');return}
 S.ovkey=k;save();cb(true,'')}

/* Route 1: the remembered folder. Reads the newest schedule sitting there and
   takes ONLY its key - the recipes are not touched, so an open batch is not
   disturbed by going looking. */
function ovKeyFromFolder(){
 var e=$('#ove');if(e)e.textContent='Looking in the tablet folder\u2026';
 if(!DIR){if(e)e.textContent='No folder is remembered on this tablet - use '+
  'the file button instead.';return}
 loadNewest(function(j){
  if(!j){if(e)e.textContent='No schedule file in the tablet folder.';return}
  ovTakeKey(j,function(ok,msg){
   if(!ok){if(e)e.textContent=msg;return}
   screenOverride();
   if($('#ove'))$('#ove').textContent='Override key loaded. Enter the reason '+
    'and passcode.'})})}

/* Route 2: pick the file. This is the one that works on a tablet with no
   folder picker. */
function ovKeyFromFile(ev){
 var f=ev&&ev.target&&ev.target.files&&ev.target.files[0];
 if(!f)return;
 var e=$('#ove');if(e)e.textContent='Reading\u2026';
 var rd=new FileReader();
 rd.onload=function(){
  var j=null;try{j=JSON.parse(rd.result)}catch(x){}
  if(!j){if($('#ove'))$('#ove').textContent='That file could not be read.';return}
  ovTakeKey(j,function(ok,msg){
   if(!ok){if($('#ove'))$('#ove').textContent=msg;return}
   screenOverride();
   if($('#ove'))$('#ove').textContent='Override key loaded. Enter the reason '+
    'and passcode.'})};
 rd.onerror=function(){if($('#ove'))$('#ove').textContent='That file could not be read.'};
 rd.readAsText(f)}
function ovLabel(){var c=ovCfg();return c&&c.label?c.label:'the CEO password'}

function hex(buf){var b=new Uint8Array(buf),o='';
 for(var i=0;i<b.length;i++)o+=('0'+b[i].toString(16)).slice(-2);return o}

/* Same PBKDF2-HMAC-SHA256 GOOS uses for passwords, so one passcode works in
   both places. Needs a secure context, which the hosted app has. */
function ovCheck(pass,cb){
 var c=ovCfg();
 if(!c||!c.hash||!c.salt){cb(false,'This schedule was sent by an older GOOS, '+
  'so it carries no override key. Send the schedule again from GOOS 2.46 or '+
  'later.');return}
 if(!(window.crypto&&crypto.subtle&&window.TextEncoder)){
  cb(false,'This browser cannot check the passcode. Open the app over https.');
  return}
 var salt=new Uint8Array((c.salt.match(/../g)||[]).map(function(h){
  return parseInt(h,16)}));
 crypto.subtle.importKey('raw',new TextEncoder().encode(pass),{name:'PBKDF2'},
  false,['deriveBits']).then(function(k){
  return crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,
   iterations:c.iter||100000,hash:'SHA-256'},k,256)}).then(function(bits){
  cb(hex(bits)===String(c.hash).toLowerCase(),'')}).catch(function(){
  cb(false,'The passcode could not be checked on this device.')})}

function ovLocked(){
 var left=Math.ceil((OV.until-Date.now())/1000);
 return left>0?left:0}

function screenOverride(){
 var b=S.batch,r=b?recipes()[b.i]:null;
 $('#hdr').innerHTML='Supervisor override';

  ? '<p class="req">Open batch: <b>'+esc(rName(r))+'</b>'+
    (b.lot?' &middot; LOT <b>'+esc(b.lot)+'</b>':'')+'</p>'

 if(b)opts+='<label class="ovopt"><input type="radio" name="ovw" value="redo" checked> '+
  '<b>Void this batch and start it again</b><br><span class="req">Same recipe, '+
  'a fresh LOT. Everything weighed so far is written to a VOID report first.</span></label>';
 if(b)opts+='<label class="ovopt"><input type="radio" name="ovw" value="back"'+
  (b?'':' checked')+'> <b>Void this batch and go back to the schedule</b><br>'+
  '<span class="req">Use this when the wrong recipe was opened.</span></label>';
 opts+='<label class="ovopt"><input type="radio" name="ovw" value="reload"'+
  (b?'':' checked')+'> <b>Reload the whole schedule from GOOS</b><br>'+
  '<span class="req">Use this when the recipe itself was corrected in GOOS and '+
  'sent again. Any open batch is voided and every recipe is unlocked.</span></label>';
 $('#app').innerHTML='<div class="card"><h2>Supervisor override</h2>'+what+
  '<p class="req">A locked batch is never edited. It is voided whole, under '+
  'your name, with the reason kept on the record.</p>'+opts+
  '<label style="margin-top:12px">Reason for the override <b>(required)</b></label>'+
  '<textarea id="ovr" rows="3" placeholder="e.g. Recipe corrected in GOOS - sugar '+
  'was 4.2 kg, should be 3.6 kg"></textarea>'+
  '<label>Your name</label><input id="ovn" autocomplete="off" value="'+esc(S.ovwho||'')+'">'+
  (ovCfg()
   ? '<label>'+esc(ovLabel().charAt(0).toUpperCase()+ovLabel().slice(1))+'</label>'+
     '<input id="ovp" type="password" autocomplete="off" inputmode="text">'
   : '<div class="ovopt"><b>This batch has no override key</b><br>'+
     '<span class="req">It was opened from a schedule sent by an older GOOS. '+
     'Send today\u2019s schedule again from GOOS 2.46 or later, then load the '+
     'key from it \u2014 the open batch is left exactly as it is.</span>'+
     '<button class="ghost" style="margin-top:10px" '+
     'onclick="ovKeyFromFolder()">Load the key from the tablet folder</button>'+
     '<label style="margin-top:8px">\u2026or pick the schedule file</label>'+
     '<input type="file" accept=".json,application/json" onchange="ovKeyFromFile(event)">'+
     '<p class="req" style="margin-top:12px">If no newer schedule can be reached '+
     'at all, this batch can still be stopped without the passcode. It is '+
     'recorded as <b>unverified</b> on the report, and it can only VOID \u2014 '+
     'it cannot change a single recorded weight or temperature.</p>'+
     '<label>To do that, type <b>VOID '+esc((S.batch&&S.batch.lot)||'BATCH')+
     '</b></label>'+
     '<input id="ovbg" autocomplete="off" placeholder="VOID '+
     esc((S.batch&&S.batch.lot)||'BATCH')+'">'+
     '</div>')+
  '<div class="err" id="ove"></div></div>';
 bar([['Cancel',function(){if(S.batch)resumeBatch();else screenList()},'ghost'],
      ['Authorise override',ovSubmit]])}

function ovSubmit(){
 var wait=ovLocked();
 if(wait){$('#ove').textContent='Too many wrong passcodes. Wait '+wait+
  ' seconds.';return}
 var how=(document.querySelector('input[name="ovw"]:checked')||{}).value||'back';
 var why=($('#ovr').value||'').trim(),who=($('#ovn').value||'').trim(),
     pass=$('#ovp').value||'';
 if(why.length<10){$('#ove').textContent=
  'Write the reason - it goes on the batch record.';return}
 if(!who){$('#ove').textContent='Enter your name.';return}
 if(!ovCfg()){
  /* Break glass. Deliberately narrow: it can only ABANDON a batch, never
     alter one, every field is still required, and the report says plainly
     that nobody authorised it. Better than a stuck tablet and staff
     inventing a LOT on paper. */
  var want='VOID '+((S.batch&&S.batch.lot)||'BATCH'),
      got=(($('#ovbg')||{}).value||'').trim().toUpperCase();
  if(got!==want.toUpperCase()){$('#ove').textContent=
   'Load the override key above, or type '+want+' to stop this batch without it.';
   return}
  if(!confirm('Stop this batch WITHOUT the passcode?\n\nThe report will record '+
   'that the override was not verified.'))return;
  S.ovwho=who;save();ovApply(how,why,who,true);return}
 if(!pass){$('#ove').textContent='Enter '+ovLabel()+'.';return}
 $('#ove').textContent='Checking\u2026';
 ovCheck(pass,function(ok,msg){
  if(!ok){
   OV.tries++;

var GC=['#1F2A4A','#256B45','#8F6111','#6B3F96','#0C6B78','#9E2E2E','#3E5F94','#755A22'];

/* THE MODULAR FIRST STEP. Plant milks pre-mix in pitchers, tea concentrates
   steep first, syrups go straight into the vat - and everything AFTER this is
   identical for all of them. Only recipes that carry a steep with both a
   temperature and a time reach this screen; anything else goes straight to
   the ingredients, exactly as before. */
/* THE PROCESS, as GOOS defined it. The stage ORDER is decided in GOOS and
   sent with the schedule, so what the operator walks through is whatever the
   recipe says - not a sequence hard-coded here that only matches one product
   family. */
function prepOf(r){var p=(r&&r.prep)||{};
 return {process:String(p.process||'plant_milk'),
  label:String(p.label||'Plant Milk Process'),
  t1:num(p.temp_initial_c||0), t2:num(p.temp_secondary_c||0),
  mins:num(p.steep_minutes||0),
  stages:(p.stages&&p.stages.length?p.stages:null),
  how:String(p.how||'Plant Milk Process')}}

/* The stages, with the constant tail guaranteed: even a schedule sent by an
   older GOOS ends with the 10-minute hold at 72 C. */
function stagesOf(r){
 var p=prepOf(r);
 if(p.stages)return p.stages;
 return [{kind:'temp',slot:'initial',min_c:p.t1||80,title:'First reading'},
         {kind:'popup',group:1,title:'1st Pre-Mix'},
         {kind:'temp',slot:'secondary',min_c:p.t2||80,title:'Second reading'},
         {kind:'popup',group:2,title:'2nd Pre-Mix'},
         {kind:'hold',minutes:10,mid_c:72,end_c:72,title:'Pasteurization hold'}]}

function stageDone(st,i){
 var b=S.batch;
 if(st.kind==='temp')return b[st.slot==='initial'?'t1':'t2']!=null;
 if(st.kind==='popup')return !!b['pop'+st.group];
 if(st.kind==='steep')return !!b.steep_at;
 return b.t4!=null}

/* The first stage not yet done - what the operator is being asked for. */
function stageOpen(r){
 var st=stagesOf(r);
 for(var i=0;i<st.length;i++)if(!stageDone(st[i],i))return i;
 return st.length}

/* The instruction card. The procedure matters as much as the weights, so it

   nobody opens. */
function prepCard(r){
 var p=prepOf(r),st=stagesOf(r),open=stageOpen(r);

  var lab=x.title+(x.kind==='temp'?(' \u2014 '+fmtNum(x.min_c)+' \u00B0C'):
   x.kind==='steep'?(' \u2014 '+fmtNum(x.minutes)+' min'):
   x.kind==='hold'?(' \u2014 10 min, 72 \u00B0C mid and end'):'');
  var state=i<open?'done':(i===open?'now':'');
  return '<div class="step"><div class="snum '+state+'">'+(i+1)+'</div>'+
   '<div style="flex:1"><div class="stitle">'+esc(lab)+'</div>'+
   (i===open?'<div class="req">you are here</div>':'')+'</div></div>'}).join('');

  '<p class="req">These are the stages for this recipe, in order. The last one '+
  'is the same for every product.</p>'+rows+'</div>'}

 return p.mode==='steep'&&p.temp>0&&p.mins>0&&!S.batch.steep_at}

function screenSteep(){

 $('#hdr').innerHTML=esc(rName(r))+'<br>LOT '+esc(b.lot);

/* ================= 5. COOK / PASTEURIZATION ================= */
var tick=null;
/* The last reading is DELIBERATELY LOWER than the one before it: the batch
   THE PASTEURIZATION IS THE ONE CONSTANT across every product he makes: a
   10-minute hold with a mid reading and an end reading, both at 72 C. Only
   the steps BEFORE it differ by recipe. */
var TSTEPS=[
 {n:1,key:'t1',title:'First reading',rule:'Must reach 80 \u00B0C',min:80,max:null,std:'min 80 C'},
 {n:2,key:'t2',title:'Second reading',rule:'Must reach 80 \u00B0C',min:80,max:null,std:'min 80 C'},
 {n:3,key:'t3',title:'Hold \u2013 mid reading',rule:'Must be 72 \u00B0C',min:72,max:null,std:'min 72 C'},
 {n:4,key:'t4',title:'Hold \u2013 end reading',rule:'Must be 72 \u00B0C',min:72,max:null,std:'min 72 C'}
];

function screenCook(){
 var r=recipes()[S.batch.i],mins=10,total=mins*60,b=S.batch;
 $('#hdr').innerHTML=esc(rName(r))+'<br>LOT '+esc(b.lot);
 function left(){return b.t0?Math.max(0,total-Math.floor((Date.now()-b.t0)/1000)):total}
 function halfDone(){return b.t0&&left()<=Math.floor(total/2)}
 function timeUp(){return b.t0&&left()===0}
 var pm1=premix(r,1),pm2=premix(r,2);
 /* WHICH READING IS OPEN comes from the recipe's own stage list. A reading
    stays shut until every stage before it is done - so a concentrate cannot
    reach its second reading before the basket filter, the steeping and the
    vat additions have each been confirmed, and a syrup is never asked for a
    pre-mix it does not have. */
 function openStep(){
  var st=stagesOf(r),i=stageOpen(r);
  if(i>=st.length)return 0;
  var cur=st[i];
  if(cur.kind==='temp')return cur.slot==='initial'?1:2;
  if(cur.kind==='hold'){
   if(b.t3==null)return halfDone()?3:0;
   if(b.t4==null)return timeUp()?4:0;
  }
  return 0}

 function card(st){
  var val=b[st.key],at=b[st.key+'_at'],
      isOpen=(openStep()===st.n),
      cls=val!=null?'set':(isOpen?'open':'wait'),body;
  if(val!=null){
   body='<div class="needband"><div class="needlab">Recorded</div>'+
    '<div class="needval">'+esc(val)+'<span class="u">\u00B0C</span></div></div>'+
    '<div class="stamp">AT '+esc(clockOf(at))+' &mdash; CANNOT BE CHANGED</div>';
  }else if(isOpen){
   body='<div class="gotlab">Thermometer reading</div>'+
    '<div class="row"><input inputmode="decimal" id="ti'+st.n+'" placeholder="\u00B0C">'+
    '<button class="dbtn gold" onclick="recTemp('+st.n+')">Record</button></div>'+
    '<div class="err" id="te'+st.n+'"></div>';
  }else{
   body='<div class="waitmsg" id="tw'+st.n+'"></div>';
  }
  return'<div class="tstep '+cls+'" id="tc'+st.n+'"><div class="thead">'+
   '<div class="tn">'+st.n+'</div><div><div class="ttitle">'+st.title+'</div>'+
   '<div class="trule">'+st.rule+'</div></div></div>'+body+'</div>'}

 var gated=(b.t2==null)||(pm2.length&&!b.pm2ok);
 var timerHTML='<div class="tbox'+(gated?' dark':'')+'">'+
   '<div class="timer" id="clock">--:--</div>'+
   '<div class="tnote" id="tnote"></div></div>'+
   ((!gated&&!b.t0)?'<button class="gold" id="go">Start the '+mins+
     '-minute hold</button>':'');

 var steps=procOf(r);
 /* the build number, where the work actually happens - so a stale cached app
    is obvious at a glance instead of being mistaken for a broken feature */
 $('#app').innerHTML='<div class="card"><h2>Cooking &amp; pasteurization'+
  '<span style="float:right;font-size:12px;opacity:.6">v'+esc(APPVER)+'</span>'+
  '</h2>'+
  '<div class="req">'+esc(rName(r))+' &middot; LOT '+esc(b.lot)+'</div>'+
  '<p class="req">Four readings, in order. Each one is final once recorded.</p>'+
  card(TSTEPS[0])+card(TSTEPS[1])+timerHTML+card(TSTEPS[2])+card(TSTEPS[3])+
  '<div class="err" id="e"></div></div>';

 function draw(){
  var c=$('#clock');if(!c){if(tick){clearInterval(tick);tick=null}return}
  var L=left();
  c.textContent=gated?'--:--':(pad(Math.floor(L/60))+':'+pad(L%60));
  $('#tnote').textContent=gated?'Locked until the second reading is recorded'
   :(b.t0?('Hold started '+clockOf(b.t0_at)):'Ready \u2014 start when the boil is holding');
  var w3=$('#tw3'),w4=$('#tw4');
  if(w3)w3.textContent=b.t2==null?'Record the second reading first.'
   :(!b.t0?'Start the hold timer.':'Unlocks at the half mark \u2014 '+
     pad(Math.floor(Math.max(0,L-Math.floor(total/2))/60))+':'+
     pad(Math.max(0,L-Math.floor(total/2))%60)+' to go.');
  if(w4)w4.textContent=timeUp()?'Record the final reading.':'Unlocks at 00:00.';
  /* The latches live on the SAVED batch, so re-rendering this screen - which
     draw() does at both marks - cannot ring the same alarm twice, and neither
     can reopening the app later. */
  if(b.t0&&!b.almHalf&&halfDone()&&!timeUp()){
   b.almHalf=1;save();
   startAlarm('half','Half way through the hold',
    'Take the reading for the first 5 minutes now. It should be 80 \u00B0C.',
    pad(Math.floor(total/120))+':00 left');}
  if(b.t0&&!b.almEnd&&timeUp()){
   b.almEnd=1;save();
   startAlarm('end','The '+mins+'-minute hold is done',
    'Bring it down and take the last reading now. It should be 72 \u00B0C.',
    '00:00');}
  if((b.t3==null&&halfDone()&&w3)||(b.t4==null&&timeUp()&&w4)){
   if(tick){clearInterval(tick);tick=null}screenCook();return}
  if(timeUp()&&tick){clearInterval(tick);tick=null}}

 if($('#go'))$('#go').onclick=function(){
  armAudio();
  b.t0=Date.now();b.t0_at=nowISO();b.almHalf=0;b.almEnd=0;save();screenCook()};

 draw();if(!gated&&b.t0&&!tick)tick=setInterval(draw,1000);
 document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&$('#clock'))draw()});

 bar([['Override',function(){if(tick){clearInterval(tick);tick=null}stopAlarm();
   screenOverride()},'ghost'],
  ['Back',function(){if(tick){clearInterval(tick);tick=null}stopAlarm();
   S.batch.step='prep';save();screenPrep()},'ghost'],
  ['Finish batch',function(){
   if(b.t1==null||b.t2==null){$('#e').textContent=
    'Record the first and second readings first.';return}
   if(!b.t0){$('#e').textContent='Start the hold timer first.';return}
   if(!timeUp()){$('#e').textContent='Wait for the timer to reach 00:00.';return}
   if(b.t3==null){$('#e').textContent='Record the first 5 minute reading.';return}
   if(b.t4==null){$('#e').textContent='Record the last 5 minute reading.';return}
   b.step='close';save();
   if(tick){clearInterval(tick);tick=null}screenClose()}]])}

function gateMin(st,r){
 /* The RECIPE's target for the two readings; the hold is fixed. A target of 0
    means "record it, but there is nothing to check it against" - the reading
    is still taken and still goes on the report.

    THIS WAS MISSING: recTemp called it, so pressing Record threw a
    ReferenceError and the button looked dead. A call to a function that does
    not exist is silent in a browser until somebody presses the thing. */
 var sl=stagesOf(r);
 for(var i=0;i<sl.length;i++){
  var x=sl[i];
  if(x.kind==='temp'&&((st.key==='t1'&&x.slot==='initial')||
                       (st.key==='t2'&&x.slot==='secondary')))
   return x.min_c>0?x.min_c:null;
 }
 return st.min}

function recTemp(n){
 var st=TSTEPS[n-1],b=S.batch,r0=recipes()[S.batch.i],
     el=$('#ti'+n),er=$('#te'+n),t=num(el?el.value:''),
     /* the RECIPE's target for the two readings; the hold stays fixed */
     mn=(n===1||n===2)?gateMin(st,r0):st.min;
 if(!t){er.textContent='Enter the thermometer reading.';return}
 if(t>130){er.textContent=t+' \u00B0C looks like a typo \u2014 check the reading.';return}
 if(mn!=null&&t<mn){
  er.textContent='Only '+t+' \u00B0C \u2014 below the required '+mn+
   ' \u00B0C. Keep heating and read again.';el.value='';return}
 if(st.max!=null&&t>st.max){
  er.textContent=t+' \u00B0C is above the '+st.max+' \u00B0C limit. '+
   'Let it settle and read again, or note it as an incident.';el.value='';return}
 if(!confirm('Record '+t+' \u00B0C for '+st.title+'?\n\nThis cannot be changed.'))return;
 b[st.key]=t;b[st.key+'_at']=nowISO();save();
 var r=recipes()[S.batch.i];
 runStages(r);}

/* Walk the recipe's stages until one needs the operator. Popups and the
   steeping timer live here, so the ORDER is whatever GOOS sent - the tablet
   does not know which product family it is looking at. */
function runStages(r){
 var b=S.batch,st=stagesOf(r),i=stageOpen(r);
 if(i>=st.length){screenCook();return}
 var cur=st[i];
 if(cur.kind==='popup'){
  var steps=premix(r,cur.group);

/* ================= 7. PDF ENGINE =================
   A small vector PDF writer: filled bands, ruled tables, coloured pills.
   No libraries, works offline, opens in any reader. */
var INK=[0.12,0.16,0.29],GREYT=[0.33,0.38,0.48],FAINTT=[0.55,0.58,0.64],
    WHITE=[1,1,1],GOLD=[0.88,0.71,0.29],GOLDBG=[0.984,0.937,0.827],
    SOFT=[0.976,0.965,0.941],ZEBRA=[0.988,0.98,0.965],RULE=[0.85,0.81,0.73],
    GREENC=[0.145,0.42,0.271],AMBERC=[0.561,0.38,0.067],REDC=[0.62,0.18,0.18];

function pdfEsc(s){return String(s).split('').map(function(c){
 return c.charCodeAt(0)>255?'?':c}).join('')
 .replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}
function f2(n){return Math.round(n*100)/100}
function textW(s,size,bold,mono){s=String(s);
 if(mono)return s.length*size*0.6;
 var w=0;
 for(var i=0;i<s.length;i++){var c=s[i];
  if(c>='0'&&c<='9')w+=0.556;
  else if(c===' ')w+=0.278;
  else if('.,:;\'|!i'.indexOf(c)>=0)w+=0.26;
  else if(c>='A'&&c<='Z')w+=0.68;
  else if('mw'.indexOf(c)>=0)w+=0.82;
  else w+=0.52}
 return w*size*(bold?1.04:1)}

function newDoc(){
 var W=595,H=842,ML=40,MR=40,BOT=64,pages=[],cur=null,y=0;
 var d={W:W,H:H,ML:ML,MR:MR,right:W-MR,inner:W-ML-MR};
 function put(s){cur.push(s)}
 d.pages=function(){return pages};
 d.newPage=function(){cur=[];pages.push(cur);y=46};
 d.y=function(){return y};
 d.at=function(v){y=v};
 d.gap=function(v){y+=v};
 d.rect=function(x,yt,w,h,c){put(c.join(' ')+' rg '+f2(x)+' '+f2(H-yt-h)+' '+
   f2(w)+' '+f2(h)+' re f')};
 d.line=function(x1,yt1,x2,yt2,c,lw){put(f2(lw||0.7)+' w '+(c||RULE).join(' ')+
   ' RG '+f2(x1)+' '+f2(H-yt1)+' m '+f2(x2)+' '+f2(H-yt2)+' l S')};
 d.text=function(s,x,yt,size,o){o=o||{};s=String(s==null?'':s);
  var fn=o.mono?'F3':(o.b?'F2':'F1'),w=textW(s,size,o.b,o.mono),xx=x;
  if(o.al==='r')xx=x-w; else if(o.al==='c')xx=x-w/2;
  put('BT /'+fn+' '+size+' Tf '+(o.c||INK).join(' ')+' rg 1 0 0 1 '+
   f2(xx)+' '+f2(H-yt-size*0.76)+' Tm ('+pdfEsc(s)+') Tj ET')};
 d.wrap=function(s,size,maxW){var words=String(s||'').split(/\s+/),out=[],l='';
  words.forEach(function(x){var t=(l?l+' ':'')+x;
   if(textW(t,size)>maxW&&l){out.push(l);l=x}else l=t});
  if(l)out.push(l);return out.length?out:['']};
 d.need=function(h,onNew){if(y+h>H-BOT){d.newPage();if(onNew)onNew();return true}
  return false};
 d.bottom=H-BOT;
 return d}

/* section heading with a gold underline */
function section(d,title){
 d.need(34);
 d.text(title,d.ML,d.y(),11.5,{b:1,c:INK});
 d.gap(15);
 d.line(d.ML,d.y(),d.ML+58,d.y(),GOLD,2.2);
 d.gap(11)}

/* a ruled table with a shaded header, zebra rows and optional pills */
function table(d,cols,rows){
 var HH=20,RH=18;
 function header(){
  d.rect(d.ML,d.y(),d.inner,HH,INK);
  var x=d.ML;
  cols.forEach(function(c){
   var tx=c.al==='r'?x+c.w-7:(c.al==='c'?x+c.w/2:x+7);
   d.text(c.t,tx,d.y()+5.5,8.5,{b:1,c:WHITE,al:c.al||'l'});
   x+=c.w});
  d.gap(HH)}
 header();
 var z=0;
 rows.forEach(function(r){
  if(r.sub){
   if(d.need(RH+HH,header)){}
   d.rect(d.ML,d.y(),d.inner,16,GOLDBG);
   d.text(String(r.sub).toUpperCase(),d.ML+7,d.y()+4,8.5,{b:1,c:[0.478,0.357,0.071]});
   d.gap(16);z=0;return}
  if(d.need(RH,header)){z=0}
  if(z%2)d.rect(d.ML,d.y(),d.inner,RH,ZEBRA);
  var x=d.ML;
  cols.forEach(function(c,i){
   var v=r.c[i],tx=c.al==='r'?x+c.w-7:(c.al==='c'?x+c.w/2:x+7);
   if(c.pill&&v){
    var pc=v==='PASS'?GREENC:(v==='WATCH'?AMBERC:REDC),
        pw=textW(v,7.5,1)+14,px=x+(c.w-pw)/2;
    d.rect(px,d.y()+3.5,pw,11.5,pc);
    d.text(v,px+pw/2,d.y()+5.6,7.5,{b:1,c:WHITE,al:'c'});
   }else{
    d.text(v,tx,d.y()+5,9,{al:c.al||'l',b:!!r.b,
      c:r.dim?GREYT:INK,mono:!!c.mono});
   }
   x+=c.w});
  d.line(d.ML,d.y()+RH,d.right,d.y()+RH,RULE,0.5);
  d.gap(RH);z++});
 d.gap(4)}

/* two-column label/value panel */
function panel(d,pairs){
 var rowH=15,n=Math.ceil(pairs.length/2),h=n*rowH+12;
 d.need(h+8);
 d.rect(d.ML,d.y(),d.inner,h,SOFT);
 d.line(d.ML,d.y(),d.ML,d.y()+h,GOLD,2.5);
 var colW=d.inner/2,top=d.y()+7;
 pairs.forEach(function(p,i){
  var cx=d.ML+10+(i%2)*colW,cy=top+Math.floor(i/2)*rowH;
  d.text(String(p[0]).toUpperCase(),cx,cy,7,{b:1,c:FAINTT});
  d.text(p[1],cx+92,cy-0.5,9,{b:!!p[2]})});
 d.gap(h+12)}

function finishDoc(d,footL){
 var pages=d.pages(),n=pages.length;
 pages.forEach(function(p,i){
  var cur=p,W=d.W,H=d.H,yy=H-44;
  cur.push(f2(0.5)+' w '+RULE.join(' ')+' RG '+f2(d.ML)+' '+f2(H-yy)+' m '+
   f2(d.right)+' '+f2(H-yy)+' l S');
  function ft(s,x,al){var w=textW(s,7.5),xx=al==='r'?x-w:x;
   cur.push('BT /F1 7.5 Tf '+FAINTT.join(' ')+' rg 1 0 0 1 '+f2(xx)+' '+
    f2(H-yy-14)+' Tm ('+pdfEsc(s)+') Tj ET')}
  ft(footL,d.ML,'l');
  ft('Page '+(i+1)+' of '+n,d.right,'r')});
 /* assemble */
 var W=d.W,H=d.H,out='%PDF-1.4\n',off=[];
 function obj(s){off.push(out.length);out+=s}
 var kids=[];for(var i=0;i<n;i++)kids.push((6+i*2)+' 0 R');
 obj('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
 obj('2 0 obj\n<< /Type /Pages /Count '+n+' /Kids ['+kids.join(' ')+'] >>\nendobj\n');
 obj('3 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\nendobj\n');
 obj('4 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>\nendobj\n');
 obj('5 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Courier-Bold /Encoding /WinAnsiEncoding >>\nendobj\n');
 pages.forEach(function(p,i){var c=p.join('\n');
  obj((6+i*2)+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+
   '] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R >> >> /Contents '+
   (7+i*2)+' 0 R >>\nendobj\n');
  obj((7+i*2)+' 0 obj\n<< /Length '+c.length+' >>\nstream\n'+c+'\nendstream\nendobj\n')});
 var xref=out.length,cnt=off.length+1;
 out+='xref\n0 '+cnt+'\n0000000000 65535 f \n'+off.map(function(o){
  var s=String(o);while(s.length<10)s='0'+s;return s+' 00000 n \n'}).join('');
 out+='trailer\n<< /Size '+cnt+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';
 var bytes=new Uint8Array(out.length);
 for(var k=0;k<out.length;k++)bytes[k]=out.charCodeAt(k)&255;
 return new Blob([bytes],{type:'application/pdf'})}

 return{format:'goos.production.report v2',

/* ---- CSV for the GOOS QA importer ------------------------------------
   One row per ingredient. The batch columns repeat on every row: GOOS
   reads them once for the QA Test and once per line for the Recipe Log.
   Excel-safe (utf-8 BOM, quotes doubled) so it can be opened and checked
   before importing. */
var CSVCOLS=['report_format','schedule_ref','prod_date','shift','product',
 'lot','lot_set_at','batch_size','produce_qty','size','scale_factor',
 'operator','signed_off_by','started_at','saved_at',
 'temp_preboil_c','temp_preboil_at','temp_cookboil_c','temp_cookboil_at',
 'hold_started_at','hold_minutes','temp_mid_past_c','temp_mid_past_at',
 'temp_final_past_c','temp_final_past_at','incidents',
 'seq','stage','ingredient_code','unit','required_qty','actual_qty',
 'variance_qty','variance_pct','grade',
 'voided','void_reason','void_by','void_at','void_verified',
 'yield_1l_bottles','yield_300_bottles',
 'steep_temp_c','steep_temp_at','steep_minutes','steep_started_at'];

function csvCell(v){
 if(v===null||v===undefined)return '';
 var s=String(v);
 return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function reportCSV(R){
 var rows=[CSVCOLS.join(',')];
 var head=[R.format||'goos.production.report v2',R.schedule_ref,R.date,R.shift,
  R.recipe,R.lot,R.lot_set_at,String(R.produce_qty)+' x '+String(R.size),
  R.produce_qty,R.size,R.scale_factor,R.operator,R.signed_off_by,
  R.started_at,R.saved_at,
  R.temp_preboil_c,R.temp_preboil_at,R.temp_cookboil_c,R.temp_cookboil_at,
  R.hold_started_at,R.hold_minutes,R.temp_mid_past_c,R.temp_mid_past_at,
  R.temp_final_past_c,R.temp_final_past_at,R.incidents];
 var ings=R.ingredients||[];
 if(!ings.length)ings=[{stage:'',code:'',uom:'',required:'',actual:'',
                        variance_pct:'',grade:''}];
 ings.forEach(function(g,i){
  var req=num(g.required),act=num(g.actual);
  rows.push(head.concat([i+1,g.stage,g.code,g.uom,g.required,g.actual,
   (req||act)?Number((act-req).toFixed(4)):'',g.variance_pct,g.grade,
   R.voided?'true':'',R.void_reason||'',R.void_by||'',R.void_at||'',
   R.void_verified||'',
   R.yield_1l_bottles===''||R.yield_1l_bottles==null?'':R.yield_1l_bottles,
   R.yield_300_bottles===''||R.yield_300_bottles==null?'':R.yield_300_bottles,
   R.steep_temp_c,R.steep_temp_at,R.steep_minutes,R.steep_started_at])
   .map(csvCell).join(','));
 });
 return '\ufeff'+rows.join('\r\n')+'\r\n';
}

  d.text(p[1]||' ',x,d.y()+10,10,{b:1});
  d.text(String(p[0]).toUpperCase(),x,d.y()+31,7.5,{b:1,c:FAINTT})});
 d.gap(52);
 d.text('Sensory, SG, Brix and pH are recorded separately in the GOOS QA Database.',
  d.ML,d.y(),8,{c:GREYT});

 return finishDoc(d,'Grain Ola  \u00B7  '+R.recipe+'  \u00B7  LOT '+R.lot)}

var REPORTDIR='Finished Production';
function baseName(R){
 if(R&&R.voided)return baseVoid(R);
 /* Named for the PRODUCTION date and the LOT - the two things anyone looks a
    report up by. The schedule reference is still inside the file. */
 var day=String(R.date||R.saved_at||'').slice(0,10).replace(/[^\d-]/g,'');
 if(!/^\d{4}-\d{2}-\d{2}$/.test(day))day=todayStr();
 return'Finished_Prod_'+day+'_'+String(R.lot).replace(/[^\w-]/g,'')}
/* A voided batch is named so nobody mistakes it for production, and so GOOS
   files it beside the real reports without importing it. */
function baseVoid(R){
 var day=String(R.date||R.saved_at||'').slice(0,10).replace(/[^\d-]/g,'');
 if(!/^\d{4}-\d{2}-\d{2}$/.test(day))day=todayStr();
 return'VOID_Prod_'+day+'_'+String(R.lot||'nolot').replace(/[^\w-]/g,'')}

function saveReport(){
 var R=reportObject(),di=S.batch.i;
 /* The row this report belongs to is stored ON the report. reshare() used to
    pass di=null, so a SUCCESSFUL resend never cleared the row's flag and the
    batch sat on NOT SENT for ever with no way to clear it - exactly the
    afternoon batches he could do nothing about. */
 R._di=di;
 S.pending.push(R);
 S.done[di]={lot:R.lot,at:R.saved_at,shared:false};
 S.batch=null;save();
 shareReport(S.pending.length-1,di)}

function shareReport(pi,di){
 var R=S.pending[pi],base=baseName(R),pdf=null,jsn=null;
 try{
  pdf=new File([reportPDF(R)],base+'.pdf',{type:'application/pdf'});
  jsn=new File([new Blob([reportCSV(R)],{type:'text/csv'})],
               base+'.csv',{type:'text/csv'});
 }catch(e){pdf=null}
 function mark(){
  var R2=S.pending[pi];
  R2._shared=true;R2._sent_at=nowISO();
  /* fall back to the row recorded on the report itself */
  var row=(di!=null)?di:(R2._di!=null?R2._di:null);
  if(row!=null&&S.done[row])S.done[row].shared=true;
  save()}
 function okFolder(){mark();
  /* When Send all is running, move straight to the next one - stopping on a
     confirmation screen after each would make a four-batch day four taps
     again, which is the thing being fixed. */
  if(sendQueue&&sendQueue.length){afterSend();return}
  $('#app').innerHTML='<div class="card"><h2>Saved</h2><p class="req"><b>'+esc(base)+
   '.pdf</b> was written into <b>'+esc(outName())+
   '</b>. OneDrive syncs it to the office on its own.</p></div>';
  bar([['Back to today\u2019s batches',afterSend]])}
 function okShare(){mark();
  if(sendQueue&&sendQueue.length){afterSend();return}
  $('#app').innerHTML='<div class="card"><h2>Sent</h2><p class="req"><b>'+esc(base)+
   '.pdf</b> was shared. In the OneDrive save sheet choose the tablet folder, '+
   'then <b>'+esc(REPORTDIR)+'</b>.</p></div>';
  bar([['Back to today\u2019s batches',afterSend]])}
 function download(){
  [pdf,jsn].forEach(function(f){if(!f)return;
   var a=document.createElement('a');a.href=URL.createObjectURL(f);
   a.download=f.name;document.body.appendChild(a);a.click();a.remove()});
  $('#app').innerHTML='<div class="card"><h2>Report ready</h2><p class="req"><b>'+
   esc(base)+'.pdf</b> was saved to this tablet\u2019s Downloads instead. Open '+
   'OneDrive and upload it into the tablet folder\u2019s <b>'+esc(REPORTDIR)+
   '</b> folder, or tap Share again.</p></div>';
  bar([['Share again',function(){shareReport(pi,di)},'ghost'],
       ['Back to today\u2019s batches',ovNext?ovContinue:screenList]])}
 function viaShare(){
  if(pdf&&navigator.canShare&&navigator.canShare({files:[pdf,jsn]})){
   navigator.share({files:[pdf,jsn],title:base}).then(okShare).catch(download)}
  else download()}
 if(DIR&&pdf)writeToDir([pdf,jsn],okFolder,viaShare);
 else viaShare()}

/* Send the report belonging to one ROW of the batch list - the tag and the
   button are next to each other, so the operator does not have to work out
   which entry in the unsent list is theirs. */
function reshareFor(di){
 for(var i=(S.pending||[]).length-1;i>=0;i--){
  if(S.pending[i]._di===di&&!S.pending[i]._shared){reshare(i);return}}
 screenList()}

function reshare(i){
 var R=S.pending[i];
 shareReport(i,(R&&R._di!=null)?R._di:null)}

var sendQueue=null;

/* Send everything still outstanding, one after another, so four batches over
   a whole day is one tap rather than four. */
function reshareAll(){
 var left=[];(S.pending||[]).forEach(function(p,i){if(!p._shared)left.push(i)});
 if(!left.length){screenList();return}
 sendQueue=left.slice(1);
 reshare(left[0])}

function afterSend(){
 if(sendQueue&&sendQueue.length){reshare(sendQueue.shift());return}
 var queued=sendQueue!=null;
 sendQueue=null;
 if(queued){screenList();return}
 if(ovNext)ovContinue();else screenList()}

/* After a VOID report has been saved, carry on to whatever the override
   chose - otherwise the supervisor lands back on the batch list and has to
   remember to restart the recipe themselves. */
function ovContinue(){
 var f=ovNext;ovNext=null;
 if(f)f();else screenList()}

/* ================= hold-timer alarm =================
   Sound is generated with the Web Audio API rather than an audio file: there
   is no asset to host, nothing to load, and it works with no signal.

   Browsers refuse to make noise until the user has interacted with the page,
   so the audio is ARMED on the same tap that starts the hold. If the page is
   reloaded mid-hold the tap is gone and the beeps stay silent - the popup
   still appears, which is why the alarm is never sound-only. */
var AC=null,ALARM={t:null,until:0,kind:null};

function armAudio(){
 try{
  if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}
  if(AC&&AC.state==='suspended')AC.resume()
 }catch(e){AC=null}
}
function audioReady(){return !!(AC&&AC.state==='running')}

function tone(freq,start,dur,vol){
 if(!AC)return;
 try{
  var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+start;
  o.type='square';o.frequency.value=freq;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.02);
  g.gain.setValueAtTime(vol,t+dur-0.05);
  g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.02)
 }catch(e){}
}
/* half time: three short pips. end of hold: a longer, lower, insistent blast. */
function burst(kind){
 if(kind==='half'){tone(1050,0,0.16,0.32);tone(1050,0.26,0.16,0.32);tone(1050,0.52,0.16,0.32)}
 else{tone(760,0,0.75,0.4);tone(600,0.85,0.75,0.4);tone(760,1.7,1.2,0.4)}
}

function startAlarm(kind,title,msg,big){
 stopAlarm(true);
 ALARM.kind=kind;
 var box=$('#alarmbox');
 box.className=(kind==='end'?'end':'');
 $('#alarmkick').textContent=(kind==='end'?'HOLD COMPLETE':'HALF WAY');
 $('#alarmtitle').textContent=title;
 $('#alarmbig').textContent=big||'';
 $('#alarmmsg').textContent=msg;
 $('#alarmquiet').textContent=audioReady()?''
  :'Sound is off because the app was reopened after the hold started.';
 $('#alarmwrap').className='on';
 bindStop();
 armAudio();burst(kind);
 /* Keep sounding until somebody stops it - a missed pasteurization gate
    matters more than a quiet commissary. It goes quiet on its own after two
    minutes so a tablet left alone overnight does not ring forever, but the
    popup STAYS so the reading is still acknowledged. */
 var every=(kind==='end'?3200:5000);
 ALARM.until=Date.now()+120000;
 ALARM.t=setInterval(function(){
  if(Date.now()>ALARM.until){clearInterval(ALARM.t);ALARM.t=null;
   $('#alarmquiet').textContent='Alarm went quiet on its own. Still waiting for you.';
   return}
  burst(ALARM.kind)
 },every);
}
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'||e.key==='Enter')stopAlarm()});
if($('#alarmwrap'))$('#alarmwrap').onclick=function(e){
 if(e.target&&e.target.id==='alarmwrap')stopAlarm()};

function stopAlarm(quiet){
 if(ALARM.t){clearInterval(ALARM.t);ALARM.t=null}
 ALARM.kind=null;
 if(!quiet){var w=$('#alarmwrap');if(w)w.className=''}
}
/* Bound here AND on every open. The markup now sits above this script so the
   load-time bind works, but a food-safety alarm should not depend on document
   order alone - the earlier build had the popup below the script, so this
   button silently had no handler and the only way out was killing the app. */
function bindStop(){var b=$('#alarmstop');if(b)b.onclick=function(){stopAlarm()}}
bindStop();


/* ================= pre-mix procedures =================
   Steps the office assigned to a Pre-Mix in the Windows recipe. They are shown
   at the moment they are actually done - after the first temperature, and
   after the second - instead of as a list at the bottom that nobody reads
   while their hands are full. Sized to be read at arm's length. */
function premix(r,n){
 var p=pick(r,['premix'+n,'preMix'+n,'pre_mix'+n],[]);
 if(typeof p==='string')p=p.split('\n');
 return (p||[]).map(function(x){return typeof x==='string'?x:pick(x,['text','step'],'')})
  .filter(function(x){return String(x).trim()})}

function showPremix(n,steps,after){
 $('#prockick').textContent=(n===1?'AFTER THE FIRST READING':'AFTER THE SECOND READING');
 $('#proctitle').textContent=(n===1?'1st Pre-Mix':'2nd Pre-Mix');
 $('#procsub').textContent='Do these now, then confirm.';
 $('#proclist').innerHTML=steps.map(function(s){
  return '<li><span>'+esc(s)+'</span></li>'}).join('');
 var btn=$('#procdone');
 btn.textContent='All '+steps.length+' done';
 btn.onclick=function(){$('#procwrap').className='';if(after)after()};
 $('#procwrap').className='on';
}

/* ================= shell ================= */
function bar(btns){
 var el=$('#bar');el.style.display='flex';el.innerHTML='';
 btns.forEach(function(b){var x=document.createElement('button');
  x.innerHTML=b[0];if(b[2])x.className=b[2];x.onclick=b[1];el.appendChild(x)})}

function resumeBatch(){({lot:screenLot,steep:screenSteep,prep:screenPrep,
 cook:screenCook,close:screenClose}[S.batch.step]||screenList)()}

function boot(){
 /* A batch in progress always wins - never interrupt a running cook. */
 if(S.sched&&S.batch){resumeBatch();return}
 if(!canPickDir()){
  /* No folder picker on this browser: reports go out by share sheet, so
     confirm that once instead of asking every morning. */
  if(!S.destMode)S.destMode='share';
  if(S.sched&&S.destMode==='share'){screenList();return}
  screenLoad();return}
 splash('Looking for today\u2019s schedule\u2026');
 restoreDir(function(state,h){
  if(state==='granted'){autoLoad(false);return}
  if(state==='ask'){screenResume(h);return}
  screenLoad()})}
boot();

if(location.protocol.indexOf('http')===0&&navigator.serviceWorker){
 navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
